import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application' version '8.12.3' apply false
    id 'com.android.library' version '8.12.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
    id 'com.diffplug.spotless' version '8.1.0' apply false
}

allprojects {
    // Apply Spotless configuration
    apply plugin: 'com.diffplug.spotless'
    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude '**/build/**/*.kt', '**/.gradle/**/*.kt'
            ktlint('1.0.0')
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
        format 'xml', {
            target '**/res/**/*.xml'
            targetExclude '**/build/**/*.xml', '**/.idea/**/*.xml', '**/.gradle/**/*.xml'
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
        groovyGradle {
            target '**/*.gradle', '**/*.gradle.kts'
            targetExclude '**/build/**/*.gradle', '**/.gradle/**/*.gradle', '**/build/**/*.gradle.kts', '**/.gradle/**/*.gradle.kts'
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
    }

    // Configure test tasks
    tasks.withType(Test).configureEach {
        maxParallelForks = (Runtime.runtime.availableProcessors() / 2)
                .clamp(1, Integer.MAX_VALUE)
                .tap { println("Setting maxParallelForks to $it") }
        testLogging {
            showExceptions true
            showCauses true
            showStackTraces true
            showStandardStreams true
            events = [
                    TestLogEvent.PASSED,
                    TestLogEvent.FAILED,
                    TestLogEvent.SKIPPED,
                    TestLogEvent.STANDARD_OUT,
                    TestLogEvent.STANDARD_ERROR
            ] as Set
            exceptionFormat = TestExceptionFormat.FULL
        }
    }

    // Apply Detekt configuration
    apply plugin: "io.gitlab.arturbosch.detekt"
    detekt {
        source = files("src/")
        config = files("${rootProject.projectDir}/config/detekt/detekt.yml")
        allRules = true
        buildUponDefaultConfig = true
        parallel = true
        autoCorrect = true
    }
    afterEvaluate {
        dependencies {
            // detektPlugins rootProject.libs.detekt
        }
    }
}

subprojects {
    // Set JVM target
    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }

    // Set common Kotlin compiler options
    tasks.withType(KotlinCompilationTask).configureEach {
        compilerOptions {
            freeCompilerArgs.addAll([
                    "-opt-in=kotlin.RequiresOptIn",
                    "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                    "-opt-in=kotlinx.coroutines.FlowPreview",
            ])
        }
    }

    // Apply KAPT configuration to all subprojects that use the kotlin-kapt plugin
    pluginManager.withPlugin('kotlin-kapt') {
        kapt {
            javacOptions {
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED")
                option("--add-opens", "jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED")
            }
        }
    }
}
